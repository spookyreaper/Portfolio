<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">LostPaw Network API overview</title>
  <desc id="desc">A dark technical illustration showing a GET reports endpoint, illustrative lost dog report JSON, and the Node.js, Sails, MongoDB, and JWT stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17262b"/><stop offset="1" stop-color="#101b24"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#69bd9a" stop-opacity=".13"/><stop offset="1" stop-color="#69bd9a" stop-opacity="0"/></radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#213238"/><stop offset="1" stop-color="#1b2932"/></linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%"><feDropShadow dx="0" dy="24" stdDeviation="23" flood-color="#050e17" flood-opacity=".42"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#719287" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <ellipse cx="920" cy="310" rx="470" ry="450" fill="url(#glow)"/>
  <g transform="translate(78 58)">
    <circle cx="10" cy="11" r="5" fill="#a4d8ba"/><ellipse cx="1" cy="2" rx="3.5" ry="4.5" transform="rotate(-28 1 2)" fill="#a4d8ba"/><ellipse cx="10" cy="-3" rx="3.5" ry="4.5" fill="#a4d8ba"/><ellipse cx="19" cy="2" rx="3.5" ry="4.5" transform="rotate(28 19 2)" fill="#a4d8ba"/>
    <text x="39" y="13" fill="#d4e0d7" font-family="Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="-.4">LostPaw Network</text>
  </g>
  <rect x="972" y="45" width="150" height="32" rx="16" fill="#21392f" stroke="#40604e" stroke-width=".8"/>
  <circle cx="991" cy="61" r="3" fill="#a4d8ba"/>
  <text x="1004" y="65" fill="#a4c6b1" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.8">API OVERVIEW</text>
  <text x="78" y="166" fill="#f1efe1" font-family="Arial,sans-serif" font-size="65" font-weight="600" letter-spacing="-2.8">A way home,</text>
  <text x="78" y="234" fill="#a4d8ba" font-family="Arial,sans-serif" font-size="65" font-weight="600" letter-spacing="-2.8">powered by code.</text>
  <text x="1120" y="218" fill="#648276" font-family="monospace" font-size="56" text-anchor="end" letter-spacing="-7">{ / }</text>
  <g transform="translate(78 289)" filter="url(#shadow)">
    <rect width="741" height="410" rx="13" fill="url(#panel)" stroke="#42534f" stroke-opacity=".65"/>
    <path d="M13 0H728Q741 0 741 13V46H0V13Q0 0 13 0" fill="#293a3d"/>
    <circle cx="23" cy="23" r="4" fill="#9c756b"/><circle cx="39" cy="23" r="4" fill="#a59b72"/><circle cx="55" cy="23" r="4" fill="#729e85"/>
    <text x="371" y="27" fill="#8ba196" font-family="monospace" font-size="10" text-anchor="middle">lostpaw / reports</text>
    <path d="M0 46H741" stroke="#3b4b48"/>
    <rect x="23" y="67" width="60" height="31" rx="5" fill="#355c46"/>
    <text x="53" y="87" fill="#bde4c8" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">GET</text>
    <text x="100" y="88" fill="#e0e8dc" font-family="monospace" font-size="20">/reports</text>
    <rect x="619" y="69" width="97" height="27" rx="14" fill="#294635"/>
    <circle cx="637" cy="82" r="3" fill="#a5d3ad"/>
    <text x="650" y="86" fill="#b4d5b6" font-family="monospace" font-size="11">200 OK</text>
    <path d="M23 116H718" stroke="#3b4b48"/>
    <g font-family="monospace" font-size="12" fill="#617e70" text-anchor="end"><text x="40" y="158">1</text><text x="40" y="196">2</text><text x="40" y="234">3</text><text x="40" y="272">4</text><text x="40" y="310">5</text></g>
    <path d="M57 139V322" stroke="#3a4c45"/>
    <g font-family="monospace" font-size="23"><text x="78" y="158" fill="#91a89c">{</text><text x="108" y="196"><tspan fill="#c8d0e0">"status"</tspan><tspan fill="#91a89c">: </tspan><tspan fill="#a9d8ae">"lost"</tspan><tspan fill="#91a89c">,</tspan></text><text x="108" y="234"><tspan fill="#c8d0e0">"animalCategory"</tspan><tspan fill="#91a89c">: </tspan><tspan fill="#a9d8ae">"dog"</tspan><tspan fill="#91a89c">,</tspan></text><text x="108" y="272"><tspan fill="#c8d0e0">"placeName"</tspan><tspan fill="#91a89c">: </tspan><tspan fill="#a9d8ae">"Brooklyn"</tspan></text><text x="78" y="310" fill="#91a89c">}</text></g>
    <path d="M23 343H718" stroke="#3b4b48"/>
    <circle cx="29" cy="376" r="3" fill="#96bca3"/>
    <text x="42" y="380" fill="#8da596" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.1">ILLUSTRATIVE REPORT DATA</text>
    <text x="716" y="380" fill="#637e70" font-family="monospace" font-size="10" text-anchor="end">application/json</text>
  </g>
  <g transform="translate(855 306)">
    <text x="2" y="12" fill="#789688" font-family="Arial,sans-serif" font-size="9" letter-spacing="2.1">THE BACKEND STACK</text>
    <path d="M13 61V308" stroke="#3e594c" stroke-dasharray="3 7"/>
    <g>
      <rect x="0" y="39" width="266" height="61" rx="9" fill="#20342f" stroke="#3a5245"/>
      <path d="M17 59 27 53 37 59V71L27 77 17 71Z" stroke="#9ac79c" fill="none" stroke-width="1.5"/>
      <text x="52" y="65" fill="#c9dccb" font-family="Arial,sans-serif" font-size="16">Node.js</text><text x="52" y="83" fill="#759281" font-family="Arial,sans-serif" font-size="9">Runtime</text><text x="243" y="74" fill="#5d7c69" font-family="monospace" font-size="12">01</text>
      <rect x="0" y="115" width="266" height="61" rx="9" fill="#20312f" stroke="#354c42"/>
      <path d="M18 153H38L28 130V153M21 150H34" stroke="#a7bdce" fill="none" stroke-width="1.5"/>
      <text x="52" y="141" fill="#c9dccb" font-family="Arial,sans-serif" font-size="16">Sails</text><text x="52" y="159" fill="#759281" font-family="Arial,sans-serif" font-size="9">Application framework</text><text x="243" y="150" fill="#5d7c69" font-family="monospace" font-size="12">02</text>
      <rect x="0" y="191" width="266" height="61" rx="9" fill="#20312f" stroke="#354c42"/>
      <path d="M28 205Q11 221 28 235Q44 222 28 205Z" stroke="#9ac79c" fill="none" stroke-width="1.5"/><path d="M28 216V239" stroke="#9ac79c" stroke-width="1.2"/>
      <text x="52" y="217" fill="#c9dccb" font-family="Arial,sans-serif" font-size="16">MongoDB</text><text x="52" y="235" fill="#759281" font-family="Arial,sans-serif" font-size="9">Data persistence</text><text x="243" y="226" fill="#5d7c69" font-family="monospace" font-size="12">03</text>
      <rect x="0" y="267" width="266" height="61" rx="9" fill="#20312f" stroke="#354c42"/>
      <rect x="19" y="291" width="18" height="14" rx="3" stroke="#c8b893" fill="none" stroke-width="1.5"/><path d="M23 291V287a5 5 0 0 1 10 0v4" stroke="#c8b893" fill="none" stroke-width="1.5"/><circle cx="28" cy="298" r="1.5" fill="#c8b893"/>
      <text x="52" y="293" fill="#c9dccb" font-family="Arial,sans-serif" font-size="16">JWT</text><text x="52" y="311" fill="#759281" font-family="Arial,sans-serif" font-size="9">Authentication</text><text x="243" y="302" fill="#5d7c69" font-family="monospace" font-size="12">04</text>
    </g>
  </g>
  <path d="M855 658H1121" stroke="#3b5144"/>
  <text x="857" y="682" fill="#7e9c8b" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.6">LOST &amp; FOUND, CONNECTED.</text>
  <text x="79" y="751" fill="#698476" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.8">LOSTPAW NETWORK / BACKEND</text>
  <text x="1120" y="751" fill="#698476" font-family="monospace" font-size="10" text-anchor="end">&lt; / &gt;</text>
</svg>
